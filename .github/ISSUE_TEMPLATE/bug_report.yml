name: Bug report
description: Report a reproducible FirstGreen defect without sensitive worker data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private repository contents, prompts, hidden reasoning, or
        unsanitized worker messages. Report security issues through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-rc1 or full Git commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Git, worker adapter/model if relevant, and sanitized doctor output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a minimal public repository/Manifest and exact commands where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private prompts, hidden reasoning, and proprietary code.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
