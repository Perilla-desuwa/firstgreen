<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560"
  viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Independent JavaScript controlled-live timeline</title>
  <desc id="desc">Documentation and core implementation start together. The core primary fails, a repair verifies, tests are released, their primary fails, their repair verifies, and final delivery passes at 289.1 seconds.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17202a; }
    .title { font-size: 24px; font-weight: 600; }
    .subtitle { font-size: 14px; fill: #52606d; }
    .axis { font-size: 13px; fill: #52606d; }
    .point-label { font-size: 12px; font-weight: 600; }
    .annotation { font-size: 13px; fill: #34495e; }
  </style>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#34495e"/></marker></defs>
  <text x="64" y="38" class="title">Independent JavaScript case: verified timeline</text>
  <text x="64" y="62" class="subtitle">Two roots start together; two primaries are rejected; delivery verifies at 289.1 s</text>
  <text x="190" y="155.0" text-anchor="end" class="axis">Documentation</text>
  <line x1="210.0" y1="150.0" x2="910.0" y2="150.0" stroke="#d9e0e6" stroke-width="1"/>
  <text x="190" y="250.0" text-anchor="end" class="axis">Core</text>
  <line x1="210.0" y1="245.0" x2="910.0" y2="245.0" stroke="#d9e0e6" stroke-width="1"/>
  <text x="190" y="345.0" text-anchor="end" class="axis">Tests</text>
  <line x1="210.0" y1="340.0" x2="910.0" y2="340.0" stroke="#d9e0e6" stroke-width="1"/>
  <text x="190" y="440.0" text-anchor="end" class="axis">Delivery</text>
  <line x1="210.0" y1="435.0" x2="910.0" y2="435.0" stroke="#d9e0e6" stroke-width="1"/>
  <line x1="210.0" y1="112" x2="210.0" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="210.0" y="500" text-anchor="middle" class="axis">0</text>
  <line x1="355.3" y1="112" x2="355.3" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="355.3" y="500" text-anchor="middle" class="axis">60</text>
  <line x1="500.6" y1="112" x2="500.6" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="500.6" y="500" text-anchor="middle" class="axis">120</text>
  <line x1="645.9" y1="112" x2="645.9" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="645.9" y="500" text-anchor="middle" class="axis">180</text>
  <line x1="791.1" y1="112" x2="791.1" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="791.1" y="500" text-anchor="middle" class="axis">240</text>
  <line x1="909.8" y1="112" x2="909.8" y2="468" stroke="#e3e8ed" stroke-width="1"/>
  <text x="909.8" y="500" text-anchor="middle" class="axis">289</text>
  <text x="560" y="532" text-anchor="middle" class="axis">Seconds from run start</text>
  <rect x="210.9" y="225.0" width="209.8" height="40" rx="5" fill="#b42318"/>
  <text x="315.8" y="250.0" text-anchor="middle" style="font-size:12px;fill:#ffffff;font-weight:600">primary × · 86.6s</text>
  <rect x="210.9" y="130.0" width="133.5" height="40" rx="5" fill="#2563eb"/>
  <text x="277.7" y="155.0" text-anchor="middle" style="font-size:12px;fill:#ffffff;font-weight:600">primary ✓ · 55.1s</text>
  <rect x="421.4" y="225.0" width="147.5" height="40" rx="5" fill="#d97706"/>
  <text x="495.1" y="250.0" text-anchor="middle" style="font-size:12px;fill:#ffffff;font-weight:600">repair ✓ · 60.9s</text>
  <rect x="569.8" y="320.0" width="184.4" height="40" rx="5" fill="#b42318"/>
  <text x="662.0" y="345.0" text-anchor="middle" style="font-size:12px;fill:#ffffff;font-weight:600">primary × · 76.2s</text>
  <rect x="755.1" y="320.0" width="153.0" height="40" rx="5" fill="#d97706"/>
  <text x="831.6" y="345.0" text-anchor="middle" style="font-size:12px;fill:#ffffff;font-weight:600">repair ✓ · 63.2s</text>
  <rect x="908.2" y="415.0" width="8.0" height="40" rx="5" fill="#16794b"/>
  <text x="902.2" y="440.0" text-anchor="end" class="point-label">verify ✓</text>
  <line x1="568.9" y1="273" x2="568.9" y2="315" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="576.9" y="292" class="annotation">core verified → tests released</text>
</svg>
