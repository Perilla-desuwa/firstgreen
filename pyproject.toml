[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "firstgreen"
version = "0.1.0rc1"
description = "HPC-inspired parallelism extraction and scheduling for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "alembic>=1.13",
  "jinja2>=3.1",
  "psutil>=6",
  "pydantic>=2.8",
  "PyYAML>=6",
  "rich>=13.9",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Perilla-desuwa/firstgreen"
Repository = "https://github.com/Perilla-desuwa/firstgreen"
Issues = "https://github.com/Perilla-desuwa/firstgreen/issues"
Documentation = "https://github.com/Perilla-desuwa/firstgreen#readme"

[project.scripts]
firstgreen = "firstgreen.cli:main"
fg = "firstgreen.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/firstgreen", "src/testbed"]

[tool.hatch.build.targets.wheel.force-include]
"tests/firstgreen_testbed_package/issues" = "firstgreen/testbed/fixtures/issues"
"tests/firstgreen_testbed_package/golden" = "firstgreen/testbed/fixtures/golden"
"tests/firstgreen_testbed_package/fakes" = "firstgreen/testbed/fixtures/fakes"
"tests/firstgreen_testbed_package/schemas" = "firstgreen/testbed/fixtures/schemas"
"tests/firstgreen_testbed_package/tinyshop" = "firstgreen/testbed/fixtures/tinyshop"

[tool.hatch.build]
exclude = [
  "tests/firstgreen_testbed_package/.runtime/**",
  ".pytest-tmp/**",
  ".tmp/**",
  "test-runtime-*/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: opt-in test that may invoke authenticated Codex"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".deps",
  ".tmp",
  ".pytest-tmp",
  "test-runtime-*",
  "tests/firstgreen_testbed_package/.runtime",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/firstgreen/db/repository.py" = ["E501"]
"src/firstgreen/cli.py" = ["B008"]
"src/firstgreen/reporting/export.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["firstgreen"]
mypy_path = "src"
exclude = "^(\\.deps|\\.tmp|\\.pytest-tmp)/|^tests[\\\\/]conftest\\.py$"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true
